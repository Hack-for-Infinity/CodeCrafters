<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroRead</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="neuroread-popup">
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">🧠</span>
        <h1>NeuroRead</h1>
      </div>
      <p class="tagline">Reading that adapts to YOUR brain</p>
    </header>

    <main class="popup-main">
      <!-- Quick Actions -->
      <section class="quick-actions">
        <h2>Quick Modes</h2>
        <div class="mode-grid">
          <button class="mode-btn" id="btn-bionic" data-mode="bionic">
            <span class="mode-icon">👁️</span>
            <span class="mode-label">Bionic Reading</span>
            <span class="mode-desc">Bold word beginnings</span>
          </button>
          <button class="mode-btn" id="btn-focus" data-mode="focus">
            <span class="mode-icon">🎯</span>
            <span class="mode-label">Focus Mode</span>
            <span class="mode-desc">Remove distractions</span>
          </button>
          <button class="mode-btn" id="btn-eye" data-mode="eye">
            <span class="mode-icon">📹</span>
            <span class="mode-label">Eye Tracking</span>
            <span class="mode-desc">Follow your gaze</span>
          </button>
          <button class="mode-btn" id="btn-scroll" data-mode="scroll">
            <span class="mode-icon">📜</span>
            <span class="mode-label">Auto Scroll</span>
            <span class="mode-desc">Hands-free reading</span>
          </button>
        </div>
      </section>

      <!-- Features -->
      <section class="features">
        <h2>Features</h2>
        <div class="feature-list">
          <label class="feature-toggle">
            <input type="checkbox" id="toggle-tts">
            <span class="toggle-slider"></span>
            <span class="feature-label">
              <span class="feature-icon">🔊</span>
              Text to Speech
            </span>
          </label>
          <label class="feature-toggle">
            <input type="checkbox" id="toggle-highlight">
            <span class="toggle-slider"></span>
            <span class="feature-label">
              <span class="feature-icon">✨</span>
              Word Highlight
            </span>
          </label>
          <label class="feature-toggle">
            <input type="checkbox" id="toggle-dyslexia">
            <span class="toggle-slider"></span>
            <span class="feature-label">
              <span class="feature-icon">🔤</span>
              Dyslexia Font
            </span>
          </label>
        </div>
      </section>

      <!-- Auto Scroll Speed -->
      <section class="speed-section" id="speed-section" style="display: none;">
        <h2>📜 Scroll Speed</h2>
        <div
          style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-card, #f8fafc); border-radius: 10px; border: 1px solid var(--border, #e2e8f0);">
          <span style="font-size: 12px; color: var(--text-muted, #94a3b8);">Slow</span>
          <input type="range" id="scroll-speed-slider" min="50" max="800" step="10" value="200"
            style="flex: 1; accent-color: #6366f1;">
          <span style="font-size: 12px; color: var(--text-muted, #94a3b8);">Fast</span>
          <span id="scroll-speed-value"
            style="min-width: 60px; text-align: center; font-weight: 700; color: var(--primary, #6366f1); font-size: 14px;">200
            WPM</span>
        </div>
      </section>

      <!-- AI Summarizer -->
      <section class="ai-section">
        <h2>🤖 AI Assistant</h2>
        <button class="ai-btn" id="btn-summarize">
          <span>✨ Summarize Page</span>
        </button>
        <div class="summary-output" id="summary-output" style="display: none;">
          <div class="summary-content"></div>
        </div>
      </section>

      <!-- Reading Stats -->
      <section class="stats-section">
        <h2>📊 Reading Stats</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="stat-wpm">0</span>
            <span class="stat-label">WPM</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-time">0m</span>
            <span class="stat-label">Time</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-words">0</span>
            <span class="stat-label">Words</span>
          </div>
        </div>
      </section>

      <!-- Theme Selector -->
      <section class="theme-section">
        <h2>🎨 Theme</h2>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="default" title="Default">
            <span class="theme-preview default"></span>
          </button>
          <button class="theme-btn" data-theme="sepia" title="Sepia">
            <span class="theme-preview sepia"></span>
          </button>
          <button class="theme-btn" data-theme="dark" title="Dark">
            <span class="theme-preview dark"></span>
          </button>
          <button class="theme-btn" data-theme="high-contrast" title="High Contrast">
            <span class="theme-preview high-contrast"></span>
          </button>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <button class="settings-btn" id="btn-settings">⚙️ Settings</button>
      <button class="settings-btn" id="btn-demo" style="flex: 0.8;">🎯 Demo</button>
      <button class="reset-btn" id="btn-reset">Reset</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
